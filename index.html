<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expensify</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h2>Expensify - Expense Tracker</h2>
    </header>

    <div class="container">
        <h4>Your Balance</h4>
        <h1 id="balance">Rp0.00</h1>

        <input type="number" id="budget" placeholder="Set Daily Budget">

        <h4>Status: <span id="status">Safe</span></h4>
        <p id="warning" style="color: #ef7264;"></p>

        <div class="inc-exp-container">
            <div>
                <h4>Income</h4>
                <p id="money-plus" class="money plus">Rp0.00</p>
            </div>

            <div>
                <h4>Expense</h4>
                <p id="money-minus" class="money minus">Rp0.00</p>
            </div>
        </div>

        <h3>History</h3>        
        <ul id="list" class="list"></ul>
        <p id="empty">No transactions yet</p>

        <h3>Add new transaction</h3>

        <form id="form"> 
            <div class="form-control">
                <label for="text">Text</label>
                <input type="text" id="text" placeholder="Enter name of transaction..." />
            </div>

            <div class="form-control">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter amount..." />
            </div>

            <div class="form-control">
                <label for="type">Type</label>
                <select id="type">
                    <option value="expense">Expense (-)</option>
                    <option value="income">Income (+)</option>
                </select>
            </div>

            <button class="btn">Add transaction</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
